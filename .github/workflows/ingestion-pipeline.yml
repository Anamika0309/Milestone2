name: Ingestion Pipeline
on:
  schedule:
    # Run daily at 4:30 AM UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for triggering the pipeline'
        required: false
        default: 'scheduled'
      force_refresh:
        description: 'Force refresh all data'
        required: false
        default: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ingestion pipeline
        run: |
          python -m src.mf_faq.ingestion.pipeline.service \
            --config-dir src/mf_faq/config \
            --input-dir data/raw \
            --output-dir data/processed \
            --index-dir data/index \
            --reason "${{ github.event.inputs.reason }}" \
            --force-refresh "${{ github.event.inputs.force_refresh }}"
      
      - name: Check for changes and update architecture
        run: |
          # Check if any data files changed
          if git status --porcelain | grep -q "data/"; then
            echo "Data changes detected, updating architecture document"
            python scripts/update_architecture.py --data-changes
          else
            echo "No data changes detected"
          fi
      
      - name: Commit and push changes
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git diff --staged --quiet || git commit -m "Automated pipeline run - $(date '+%Y-%m-%d %H:%M:%S')"
          git push
